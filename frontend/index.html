<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de productos</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <h1>Catálogo de productos</h1>
            <button class="button button--primary" type="button" id="add-product">
                Agregar producto
            </button>
        </div>
    </header>

    <main class="container">
        <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>

        <section class="card" aria-labelledby="list-title">
            <div class="card-header">
                <h2 id="list-title">Productos</h2>
                <span id="product-count">— productos</span>
            </div>

            <p id="loading">Cargando productos…</p>
            <p id="empty" hidden>No hay productos cargados.</p>

            <div id="error" class="error-state" role="alert" hidden>
                <p id="error-message"></p>
                <button class="button" type="button" id="retry">Reintentar</button>
            </div>

            <div id="table-wrapper" class="table-wrapper" hidden>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="number">Precio ARS</th>
                            <th class="number">Precio USD</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="products"></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="product-dialog" class="dialog" aria-labelledby="form-title">
        <div class="dialog-header">
            <h2 id="form-title">Agregar producto</h2>
            <button class="close-button" type="button" id="close-product-dialog" aria-label="Cerrar">×</button>
        </div>

        <form id="product-form" novalidate>
            <div class="form-grid">
                <label>
                    Nombre
                    <input id="nombre" name="nombre" maxlength="255"
                           aria-describedby="nombre-error" required>
                    <span id="nombre-error" class="field-error" data-error="nombre"></span>
                </label>

                <label>
                    Precio en pesos
                    <input id="precio" name="precio" inputmode="decimal" placeholder="1500.00"
                           aria-describedby="precio-error" required>
                    <span id="precio-error" class="field-error" data-error="precio"></span>
                </label>
            </div>

            <label>
                Descripción
                <textarea id="descripcion" name="descripcion" rows="3"
                          aria-describedby="descripcion-error"></textarea>
                <span id="descripcion-error" class="field-error" data-error="descripcion"></span>
            </label>

            <div class="dialog-actions">
                <button class="button" type="button" id="cancel-edit">Cancelar</button>
                <button class="button button--primary" type="submit" id="save">Guardar</button>
            </div>
        </form>
    </dialog>

    <dialog id="delete-dialog" class="dialog dialog--small" aria-labelledby="delete-title">
        <h2 id="delete-title">Eliminar producto</h2>
        <p>¿Querés eliminar <strong id="delete-product-name"></strong>?</p>
        <p id="delete-error" class="field-error" role="alert" hidden></p>

        <div class="dialog-actions">
            <button class="button" type="button" id="cancel-delete">Cancelar</button>
            <button class="button button--danger" type="button" id="confirm-delete">Eliminar</button>
        </div>
    </dialog>
</body>
</html>
